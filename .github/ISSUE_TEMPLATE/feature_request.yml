name: Feature request
description: An idea that would make LangSync better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe your project setup and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A flag, a config key, an example of the output you would expect.
